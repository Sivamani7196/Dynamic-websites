<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Sum Even Numbers</title>  
    <style>  
        body {  
            font-family: Arial, sans-serif;  
            margin: 20px;  
        }  
        input {  
            width: 300px;  
            padding: 10px;  
            margin-right: 10px;  
        }  
        button {  
            padding: 10px;  
        }  
        #result {  
            margin-top: 20px;  
            font-weight: bold;  
        }  
    </style>  
</head>  
<body>  

    <h1>Sum of Even Numbers</h1>  
    <p>Enter numbers separated by commas (e.g., 1, 2, 3, 4):</p>  
    
    <input type="text" id="numberInput" placeholder="Enter numbers here">  
    <button onclick="calculateSum()">Calculate Sum</button>  

    <div id="result"></div>  

    <script>  
        function sumEvenNumbers(numbers) {  
            return numbers  
                .filter(num => num % 2 === 0) // Select even numbers  
                .reduce((sum, num) => sum + num, 0); // Sum them up  
        }  

        function calculateSum() {  
            const input = document.getElementById('numberInput').value;  
            const numArray = input  
                .split(',')  
                .map(num => parseFloat(num.trim())) // Convert to an array of numbers  
                .filter(num => !isNaN(num)); // Remove any NaN values  

            const sum = sumEvenNumbers(numArray);  
            document.getElementById('result').innerText = `Sum of even numbers: ${sum}`;   
        }  
    </script>  

</body>  
</html>
